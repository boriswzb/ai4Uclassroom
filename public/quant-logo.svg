<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 40">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b45309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 图标：翻开的书 + AI 节点 -->
  <g transform="translate(0, 2)">
    <!-- 书本左页 -->
    <path d="M4 28 Q4 6 20 6 L20 32 Q4 32 4 28Z" fill="url(#brandGrad)" opacity="0.9"/>
    <!-- 书本右页 -->
    <path d="M36 28 Q36 6 20 6 L20 32 Q36 32 36 28Z" fill="url(#brandGrad)" opacity="0.7"/>
    <!-- 书脊线 -->
    <line x1="20" y1="6" x2="20" y2="32" stroke="white" stroke-width="1" opacity="0.3"/>
    <!-- 书页线条装饰 -->
    <line x1="8" y1="14" x2="18" y2="14" stroke="white" stroke-width="0.8" opacity="0.4"/>
    <line x1="8" y1="19" x2="16" y2="19" stroke="white" stroke-width="0.8" opacity="0.3"/>
    <line x1="22" y1="14" x2="32" y2="14" stroke="white" stroke-width="0.8" opacity="0.4"/>
    <line x1="22" y1="19" x2="30" y2="19" stroke="white" stroke-width="0.8" opacity="0.3"/>

    <!-- AI 网络节点 - 在书上方 -->
    <circle cx="20" cy="3" r="3.5" fill="url(#accentGrad)"/>
    <circle cx="8" cy="10" r="2.2" fill="url(#brandGrad)"/>
    <circle cx="32" cy="10" r="2.2" fill="url(#brandGrad)"/>
    <line x1="20" y1="3" x2="8" y2="10" stroke="url(#brandGrad)" stroke-width="1" opacity="0.6"/>
    <line x1="20" y1="3" x2="32" y2="10" stroke="url(#brandGrad)" stroke-width="1" opacity="0.6"/>
    <line x1="8" y1="10" x2="32" y2="10" stroke="url(#brandGrad)" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- 文字：AI4U -->
  <text x="46" y="28" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="url(#brandGrad)" letter-spacing="-0.5">AI4U</text>

  <!-- 文字：量化交易系统（同高粗体，金色渐变以示区别） -->
  <text x="98" y="28" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="url(#accentGrad)" letter-spacing="-0.3">量化交易系统</text>
</svg>
